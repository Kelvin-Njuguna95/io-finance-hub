<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Table row</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: var(--surface-2); font-family: var(--font-sans); font-size: 13px; }
  .tbl {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; background: var(--surface-2); color: var(--muted-foreground);
    font-size: 12px; font-weight: 600; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:nth-child(even) td { background: var(--surface-3); }
  tr.selected td { background: var(--primary-soft); }
  tr.hover td { background: var(--muted); }
  .num { font-family: var(--font-mono); text-align: right; }
  .est { font-style: italic; color: var(--muted-foreground); }
  .acc { position: relative; }
  .acc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .acc-ok::before    { background: var(--success); }
  .acc-warn::before  { background: var(--warning); }
  .acc-bad::before   { background: var(--danger); }
  .chip { display: inline-flex; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 500; }
  .ok    { background: var(--success-soft); color: var(--success-soft-foreground); }
  .info  { background: var(--info-soft); color: var(--info-soft-foreground); }
  .bad   { background: var(--danger-soft); color: var(--danger-soft-foreground); }
</style>
</head><body>
  <div class="tbl">
    <table>
      <thead><tr>
        <th>Invoice</th><th>Client</th><th>Status</th><th style="text-align:right;">Amount</th>
      </tr></thead>
      <tbody>
        <tr class="acc acc-ok"><td class="num">INV-2026-0412</td><td>Ada Outbound</td><td><span class="chip ok">Paid</span></td><td class="num">KES 1,480,000</td></tr>
        <tr class="acc acc-warn hover"><td class="num">INV-2026-0413</td><td>Vega Collections</td><td><span class="chip info">Submitted</span></td><td class="num est">≈ KES 920,500</td></tr>
        <tr class="acc acc-ok selected"><td class="num">INV-2026-0414</td><td>Helios CX</td><td><span class="chip ok">Confirmed</span></td><td class="num">KES 2,145,000</td></tr>
        <tr class="acc acc-bad"><td class="num">INV-2026-0415</td><td>Meridian Care</td><td><span class="chip bad">Overdue</span></td><td class="num">KES 640,000</td></tr>
      </tbody>
    </table>
  </div>
</body></html>
