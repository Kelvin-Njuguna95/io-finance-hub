<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Radii — 4 stops</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-2); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { background: var(--card); border: 1px solid var(--border); padding: 16px; text-align: center; }
  .tile { width: 56px; height: 56px; margin: 0 auto 10px; background: var(--primary); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--foreground); font-weight: 600; }
  .px { font-size: 10px; color: var(--muted-foreground); margin-top: 2px; font-family: var(--font-mono); }
  .use { font-size: 10px; color: var(--muted-foreground); margin-top: 4px; letter-spacing: 0.02em; }
  .sm  { border-radius: var(--radius-sm); }
  .bas { border-radius: var(--radius); }
  .lg  { border-radius: var(--radius-lg); }
  .full{ border-radius: var(--radius-full); width: 92px; }
</style>
</head><body>
  <div class="row">
    <div class="cell" style="border-radius: var(--radius-sm);">
      <div class="tile sm"></div>
      <div class="name">--radius-sm</div><div class="px">4px · 0.25rem</div>
      <div class="use">badges · switches · checkboxes</div>
    </div>
    <div class="cell" style="border-radius: var(--radius);">
      <div class="tile bas"></div>
      <div class="name">--radius (base)</div><div class="px">6px · 0.375rem</div>
      <div class="use">inputs · buttons · small cards</div>
    </div>
    <div class="cell" style="border-radius: var(--radius-lg);">
      <div class="tile lg"></div>
      <div class="name">--radius-lg</div><div class="px">10px · 0.625rem</div>
      <div class="use">dialogs · popovers · larger cards</div>
    </div>
    <div class="cell" style="border-radius: var(--radius-lg);">
      <div class="tile full"></div>
      <div class="name">--radius-full</div><div class="px">pill</div>
      <div class="use">pills only · tabs-selected</div>
    </div>
  </div>
</body></html>
