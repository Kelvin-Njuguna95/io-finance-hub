<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Semantic colours</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; background: var(--card); }
  .anchor { height: 38px; display:flex; align-items:center; padding: 0 12px; font-family: var(--font-mono); font-size: 11px; color: #fff; }
  .soft { height: 38px; display:flex; align-items:center; padding: 0 12px; font-family: var(--font-mono); font-size: 11px; }
  .meta { padding: 8px 12px 10px; font-size: 11px; color: var(--muted-foreground); border-top: 1px solid var(--border); display:flex; justify-content:space-between; }
  .name { font-weight: 600; color: var(--foreground); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
</style>
</head><body>
  <div class="grid">
    <div class="cell">
      <div class="anchor" style="background: var(--success);">anchor</div>
      <div class="soft"   style="background: var(--success-soft); color: var(--success-soft-foreground);">-soft</div>
      <div class="meta"><span class="name">Success</span><span>green · 150</span></div>
    </div>
    <div class="cell">
      <div class="anchor" style="background: var(--warning); color: var(--warning-foreground);">anchor</div>
      <div class="soft"   style="background: var(--warning-soft); color: var(--warning-soft-foreground);">-soft</div>
      <div class="meta"><span class="name">Warning</span><span>amber · 70</span></div>
    </div>
    <div class="cell">
      <div class="anchor" style="background: var(--danger);">anchor</div>
      <div class="soft"   style="background: var(--danger-soft); color: var(--danger-soft-foreground);">-soft</div>
      <div class="meta"><span class="name">Danger</span><span>red · 25</span></div>
    </div>
    <div class="cell">
      <div class="anchor" style="background: var(--info);">anchor</div>
      <div class="soft"   style="background: var(--info-soft); color: var(--info-soft-foreground);">-soft</div>
      <div class="meta"><span class="name">Info</span><span>blue · 258</span></div>
    </div>
  </div>
</body></html>
