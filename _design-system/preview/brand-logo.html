<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Brandmark</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-2); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel {
    border-radius: var(--radius-lg); padding: 24px;
    display: flex; align-items: center; gap: 16px; min-height: 110px;
    border: 1px solid var(--border);
  }
  .panel.sidebar { background: linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 80%); }
  .panel.login   { background: var(--ink); border-color: rgba(250,250,247,0.06); }
  .panel.login .names .eye { color: rgba(250,250,247,0.65); }
  .panel.login .names .title { color: var(--paper); }
  .tile {
    width: 48px; height: 48px; border-radius: var(--radius);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 500; font-size: 16px;
    flex-shrink: 0;
  }
  .tile.ink  { background: var(--ink);  color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
  .tile.gold { background: var(--gold); color: var(--ink);  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10); }
  .names { display: flex; flex-direction: column; min-width: 0; }
  .names .eye { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted-foreground); font-weight: 500; }
  .names .title { font-family: var(--font-display); font-size: 20px; font-weight: 400; letter-spacing: -0.01em; color: var(--foreground); margin-top: 4px; }
  .cap { font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted-foreground); margin-bottom: 10px; }
</style>
</head><body>
  <div class="grid">
    <div>
      <div class="cap">Sidebar variant · ink tile on paper</div>
      <div class="panel sidebar">
        <span class="tile ink">IO</span>
        <span class="names">
          <span class="eye">Impact Outsourcing</span>
          <span class="title">Finance Hub</span>
        </span>
      </div>
    </div>
    <div>
      <div class="cap">Login variant · gold tile on ink</div>
      <div class="panel login">
        <span class="tile gold">IO</span>
        <span class="names">
          <span class="eye">Impact Outsourcing</span>
          <span class="title">Finance Hub</span>
        </span>
      </div>
    </div>
  </div>
</body></html>
