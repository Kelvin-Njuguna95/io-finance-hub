<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Finance Hub · Sign in</title>
<link rel="stylesheet" href="./kit.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  .login-stage {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(700px 480px at 85% 15%, color-mix(in oklab, var(--gold) 18%, var(--paper)) 0%, transparent 60%),
      radial-gradient(700px 500px at 10% 85%, var(--paper-2) 0%, transparent 60%),
      var(--paper);
  }
  .login-card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.92);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-overlay);
  }
  .login-card .brand-tile {
    width: 52px; height: 52px; border-radius: var(--radius-lg);
    background: var(--gold); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 500; font-size: 18px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);
  }
  .login-card h2 { margin: 18px 0 4px; font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: -0.01em; color: var(--foreground); font-variation-settings: "opsz" 48; }
  .login-card h2 em { font-style: italic; color: var(--gold-lo); font-weight: 400; }
  .login-card .sub { margin: 0 0 20px; color: var(--muted-foreground); font-size: 13px; }
  .login-card .field label { color: var(--foreground); }
  .login-card .input {
    background: var(--paper);
    border: 1px solid var(--border);
    color: var(--foreground);
  }
  .login-card .input::placeholder { color: var(--muted-foreground); }
  .login-card .input:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-color: transparent; }
  .login-card .btn.primary {
    background: var(--ink); color: var(--paper);
    width: 100%; height: 40px; justify-content: center; font-weight: 500;
  }
  .login-card .btn.primary:hover { background: var(--ink-2); }
  .login-card .foot { margin-top: 16px; font-size: 12px; color: var(--muted-foreground); text-align: center; }
  .login-card .foot a { color: var(--gold-lo); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
</style>
</head>
<body>
<div class="login-stage">
  <form class="login-card" onsubmit="event.preventDefault(); window.location='./index.html';">
    <span class="brand-tile">IO</span>
    <h2>Sign in to <em>continue.</em></h2>
    <p class="sub">Impact Outsourcing · Finance Hub</p>

    <div class="field" style="margin-bottom: 12px;">
      <label for="email">Email</label>
      <input class="input" id="email" type="email" placeholder="you@impactoutsourcing.co.ke" autocomplete="email" required/>
    </div>
    <div class="field" style="margin-bottom: 18px;">
      <label for="pin">4-digit PIN</label>
      <input class="input" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required
             style="font-family: var(--font-mono); letter-spacing: 0.5em; text-align: center;"/>
    </div>
    <button type="submit" class="btn primary"><i data-lucide="arrow-right"></i>Continue</button>

    <div class="foot">
      <a href="#">Forgot PIN?</a> · <a href="#">Request access</a>
    </div>
  </form>
</div>
<script>window.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body></html>
